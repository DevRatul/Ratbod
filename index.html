<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F5" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />
    <meta name="apple-mobile-web-app-title" content="RatboD" />
    <script>
      (function() {
        try {
          var manual = localStorage.getItem('ratbod_theme_manual');
          var isDark = false;
          if (manual === 'dark') {
            isDark = true;
          } else if (manual === 'light') {
            isDark = false;
          } else {
            var h = new Date().getHours();
            isDark = h >= 18 || h < 6;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0A0A0A');
            var apple = document.getElementById('apple-status-bar-meta');
            if (apple) apple.setAttribute('content', 'black-translucent');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json?v=8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=8" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8" />
    <link rel="apple-touch-icon" sizes="any" href="/favicon.svg?v=8" />
    <link rel="apple-touch-icon-precomposed" href="/favicon.svg?v=8" />

    <title>RatboD - Body Metrics & Health Tracker</title>
