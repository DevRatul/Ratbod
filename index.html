    <script>
      (function() {
        try {
          // Shim Vite HMR WebSocket in container sandbox to eliminate failed socket retries and net::ERR_CONNECTION_REFUSED errors
          var OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('24678') !== -1 || url.indexOf('token=') !== -1))) {
                var fakeWs = new EventTarget();
                fakeWs.readyState = 1;
                fakeWs.send = function() {};
                fakeWs.close = function() {};
                setTimeout(function() {
                  if (typeof fakeWs.onopen === 'function') fakeWs.onopen(new Event('open'));
                  fakeWs.dispatchEvent(new Event('open'));
                }, 0);
                return fakeWs;
              }
              return new OrigWS(url, protocols);
            };
            window.WebSocket.prototype = OrigWS.prototype;
            window.WebSocket.CONNECTING = OrigWS.CONNECTING;
            window.WebSocket.OPEN = OrigWS.OPEN;
            window.WebSocket.CLOSING = OrigWS.CLOSING;
            window.WebSocket.CLOSED = OrigWS.CLOSED;
          }

          var _origErr = console.error;
          console.error = function() {
            if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1 && (arguments[0].indexOf('websocket') !== -1 || arguments[0].indexOf('failed to connect') !== -1)) {
              if (console.debug) console.debug.apply(console, arguments);
              return;
            }
            _origErr.apply(console, arguments);
          };
          var mode = localStorage.getItem('ratool_theme_mode') || localStorage.getItem('ratbod_theme_mode');
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            // Automatic Sunset to Sunrise
            var now = new Date();
            var start = new Date(now.getFullYear(), 0, 0);
            var day = Math.floor((now.getTime() - start.getTime()) / 86400000);
            var rad = Math.PI / 180;
            var decl = 23.44 * rad * Math.sin((360 / 365) * (day - 81) * rad);
            var lat = 28;
            var cachedLat = localStorage.getItem('ratool_user_lat') || localStorage.getItem('ratbod_user_lat');
            if (cachedLat) {
              var parsedLat = parseFloat(cachedLat);
              if (!isNaN(parsedLat)) lat = parsedLat;
            } else {
              var tz = (Intl.DateTimeFormat && Intl.DateTimeFormat().resolvedOptions().timeZone) || '';
              if (tz.indexOf('Dhaka') !== -1 || tz.indexOf('Kolkata') !== -1 || tz.indexOf('Asia') !== -1) lat = 24;
              else if (tz.indexOf('London') !== -1 || tz.indexOf('Europe') !== -1) lat = 50;
              else if (tz.indexOf('New_York') !== -1 || tz.indexOf('America') !== -1) lat = 38;
              else if (tz.indexOf('Australia') !== -1) lat = -33;
            }
            var phi = lat * rad;
            var cosH = -Math.tan(phi) * Math.tan(decl);
            var clamped = Math.max(-1, Math.min(1, cosH));
            var H = Math.acos(clamped) / rad / 15;
            var b = (360 / 365) * (day - 81) * rad;
            var eot = (9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b)) / 60;
            var noon = 12 - eot;
            var sunrise = Math.max(0, Math.min(24, noon - H));
            var sunset = Math.max(0, Math.min(24, noon + H));
            var curH = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
            isDark = curH < sunrise || curH >= sunset;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0A0A0A');
            var apple = document.getElementById('apple-status-bar-meta');
            if (apple) apple.setAttribute('content', 'black-translucent');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
